<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Location Update | Fresh Grocers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <div class="logo">Fresh <span>Grocers</span></div>
      <div class="menu-toggle" id="menuToggle">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="agent-location.html" class="active">Update Location</a></li>
        <li><a href="delivery-register.html">Delivery Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <div class="form-container">
        <h2>Delivery Agent Location Update</h2>
        <form id="locationForm">
          <div class="form-group">
            <label>Current Area / Location</label>
            <input type="text" id="agentArea" placeholder="Example: Colombo 04" required>
          </div>
          <div class="form-group">
            <label>Additional Notes</label>
            <textarea id="locationNotes" placeholder="Example: Near Marine Drive junction"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Update Location</button>
        </form>
        <div id="locationMsg" class="message-box"></div>
        <p class="small-text">This page supports the requirement where delivery agents manually update their location.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p>© 2026 Fresh Grocers Sri Lanka. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
