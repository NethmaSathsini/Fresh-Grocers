<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order | Fresh Grocers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <div class="logo">Fresh <span>Grocers</span></div>
      <div class="menu-toggle" id="menuToggle">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="place-order.html" class="active">Place Order</a></li>
        <li><a href="customer-dashboard.html">Dashboard</a></li>
        <li><a href="rating.html">Rate Delivery</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <div class="form-container">
        <h2>Place Grocery Order</h2>
        <form id="orderForm">
          <div class="form-row">
            <div class="form-group">
              <label>Customer Name</label>
              <input type="text" required>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" required>
            </div>
          </div>
          <div class="form-group">
            <label>Delivery Location</label>
            <input type="text" placeholder="Enter customer location" required>
          </div>
          <div class="form-group">
            <label>Order Items</label>
            <textarea placeholder="Example: Rice 2kg, Milk Powder 1 pack, Apples 1kg" required></textarea>
          </div>
          <div class="form-group">
            <label>Select Nearby Available Delivery Agent</label>
            <div id="agentList" class="agent-list"></div>
          </div>
          <button type="submit" class="btn btn-primary">Confirm Order</button>
        </form>
        <div id="orderMsg" class="message-box"></div>
        <p class="small-text">After confirmation, an SMS simulation appears with delivery agent phone number and ETA.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p>© 2026 Fresh Grocers Sri Lanka. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
