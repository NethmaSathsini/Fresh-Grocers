<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSR Manual Order | Fresh Grocers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <div class="logo">Fresh <span>Grocers</span></div>
      <div class="menu-toggle" id="menuToggle">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="place-order.html">Place Order</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <div class="form-container">
        <h2>Customer Service Representative Order Entry</h2>
        <form id="csrOrderForm">
          <div class="form-row">
            <div class="form-group">
              <label>Customer Name</label>
              <input type="text" required>
            </div>
            <div class="form-group">
              <label>Customer Phone Number</label>
              <input type="tel" id="customerPhone" required>
            </div>
          </div>
          <div class="form-group">
            <label>Customer Location</label>
            <input type="text" required>
          </div>
          <div class="form-group">
            <label>Order Details</label>
            <textarea required></textarea>
          </div>
          <div class="form-group">
            <label>Nearby Available Delivery Agents</label>
            <div id="csrAgentList" class="agent-list"></div>
          </div>
          <button type="submit" class="btn btn-primary">Submit Manual Order</button>
        </form>
        <div id="csrMsg" class="message-box"></div>
        <p class="small-text">This simulates requirement (d) and (e), where the CSR enters the order and customer receives SMS confirmation.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p>© 2026 Fresh Grocers Sri Lanka. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
