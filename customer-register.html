<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Fresh Grocers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container navbar">
      <div class="logo">Fresh <span>Grocers</span></div>
      <div class="menu-toggle" id="menuToggle">☰</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="customer-register.html" class="active">Customer Register</a></li>
        <li><a href="delivery-register.html">Delivery Register</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <div class="form-container">
        <h2>Customer Registration</h2>
        <form id="customerRegisterForm">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="name" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
              <label>City / Area</label>
              <input type="text" name="area" required>
            </div>
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea name="address" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Register Customer</button>
        </form>
        <div id="customerRegisterMsg" class="message-box"></div>
        <p class="small-text">After registration, the system simulates sending an email with unique username and password.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p>© 2026 Fresh Grocers Sri Lanka. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
